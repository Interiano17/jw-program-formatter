[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-generator"
dynamic = ["version"]
description = "Generador del programa S-140 a partir de documentos DOCX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.3",
]

[project.scripts]
meeting-generator = "meeting_generator.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_generator*"]

[tool.setuptools.dynamic]
version = {attr = "meeting_generator.__version__"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["meeting_generator"]
check_untyped_defs = true
warn_unused_configs = true
show_error_codes = true
