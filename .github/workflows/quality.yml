name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"

      - name: Verify package entry points
        run: |
          python -c "import meeting_generator; import meeting_generator.__main__"
          test -x "$(command -v meeting-generator)"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run Ruff
        run: python -m ruff check meeting_generator tests

      - name: Check formatting
        run: python -m ruff format --check meeting_generator tests

      - name: Run Mypy
        run: python -m mypy meeting_generator
